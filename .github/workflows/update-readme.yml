name: Update README quote

on:
  schedule:
    - cron: "0 13 * * *"  # daily at 13:00 UTC 
  workflow_dispatch:        # can trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-quote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pick a new quote and update README
        run: python update_readme.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update daily quote"
          git push
